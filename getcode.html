<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>读取家庭密钥（只读）</title>
<style>
  body {
    margin:0; padding:22px 18px; background:#f5f7fa; color:#1f2d3d;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.6;
  }
  h1 { font-size:20px; margin:0 0 6px; }
  .sub { font-size:13px; color:#5a6b7d; margin-bottom:18px; }
  .card { background:#fff; border-radius:14px; padding:16px; margin-bottom:14px;
          box-shadow:0 2px 10px rgba(0,0,0,.06); }
  .label { font-size:12.5px; color:#5a6b7d; margin-bottom:6px; }
  .val { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:15px; word-break:break-all;
         background:#f0f4f8; border-radius:9px; padding:11px 12px; user-select:all; -webkit-user-select:all; }
  .val.empty { color:#c0392b; background:#fdecea; }
  .ok { color:#1e8449; font-weight:700; }
  .bad { color:#c0392b; font-weight:700; }
  button { width:100%; padding:14px; border:none; border-radius:12px; background:#0984e3; color:#fff;
           font-size:16px; font-weight:700; margin-top:8px; font-family:inherit; }
  button:active { opacity:.8; }
  .note { font-size:12px; color:#7b8a9a; margin-top:8px; line-height:1.7; }
  ul { margin:6px 0 0; padding-left:20px; font-size:13.5px; }
  li { margin-bottom:5px; }
  code { background:#f0f4f8; padding:1px 5px; border-radius:4px; font-size:13px; }
</style>
</head>
<body>

<h1>读取家庭密钥（只读）</h1>
<div class="sub">本页面<b>不会向云端写入任何数据</b>，只从本机浏览器读取并显示。</div>

<div class="card">
  <div class="label">家庭码 family_code</div>
  <div class="val" id="vCode">读取中…</div>
</div>

<div class="card">
  <div class="label">加密密钥 family_salt<span id="saltTip"></span></div>
  <div class="val" id="vSalt">读取中…</div>
  <button id="btnCopy" onclick="copySalt()">长按上方文字复制，或点这里复制</button>
  <div class="note">
    把这串值发给我，我就能帮你恢复云端加密密钥。<br>
    复制成功后，页面会提示你「已复制」。
  </div>
</div>

<div class="card">
  <div class="label">本机记录数据概况（只统计，不读取内容）</div>
  <div class="val" id="vRecs">统计中…</div>
  <div class="note" id="recNote"></div>
</div>

<div class="card">
  <div class="label">如果上面显示「未找到」</div>
  <ul>
    <li>说明你当前这个浏览器<b>没有登录过家庭码</b>（localStorage 是空的）。</li>
    <li>请改用<b>你平时记录小咕噜的那个浏览器</b>打开本页面。</li>
    <li>若你平时是在微信里打开的，请点右上角「⋯」→<b>在浏览器中打开</b>。</li>
  </ul>
</div>

<script>
(function () {
  // 仅读取 localStorage，绝不发起任何网络请求
  var code = localStorage.getItem('family_code');
  var salt = localStorage.getItem('family_salt');
  var fid   = localStorage.getItem('family_id');

  function show(el, v, tipWhenEmpty) {
    if (v) { el.textContent = v; el.classList.remove('empty'); return true; }
    el.textContent = '未找到（' + tipWhenEmpty + '）';
    el.classList.add('empty'); return false;
  }
  show(document.getElementById('vCode'), code, '本浏览器未记录家庭码');
  var hasSalt = show(document.getElementById('vSalt'), salt, '本浏览器未记录密钥');
  document.getElementById('saltTip').innerHTML = hasSalt ? ' <span class="ok">✓ 已找到</span>' : ' <span class="bad">✗ 缺失</span>';

  // 统计本机记录（只看 key 数量与日期，不展示内容）
  var dates = [], acts = 0;
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      var m = /^records_(\d{4}-\d{2}-\d{2})$/.exec(k);
      if (m) {
        dates.push(m[1]);
        try { acts += JSON.parse(localStorage.getItem(k) || '[]').length; } catch (e) {}
      }
    }
  } catch (e) {}
  dates.sort();
  var el = document.getElementById('vRecs');
  if (dates.length) {
    el.textContent = dates.length + ' 天 / 共 ' + acts + ' 条';
    document.getElementById('recNote').innerHTML =
      '日期范围：<code>' + dates[0] + '</code> ~ <code>' + dates[dates.length - 1] + '</code><br>' +
      '这些数据<b>还在你手机上</b>，密钥恢复后打开 App 即可自动传回云端。';
  } else {
    el.textContent = '本机没有记录数据';
    document.getElementById('recNote').textContent = '若本机也没数据，才需要用相册截图来还原。';
  }
  window.__salt = salt;
})();

function copySalt() {
  var s = window.__salt;
  if (!s) { alert('本浏览器没有找到密钥，请换用平时记录小咕噜的浏览器打开'); return; }
  var done = function () { alert('已复制：\n' + s + '\n\n请粘贴发送给我'); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(s).then(done, function () { fallback(s, done); });
  } else { fallback(s, done); }
}
function fallback(s, cb) {
  var ta = document.createElement('textarea');
  ta.value = s; ta.style.position = 'fixed'; ta.style.left = '-9999px';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); cb(); }
  catch (e) { prompt('请手动长按复制下面的密钥：', s); }
  document.body.removeChild(ta);
}
</script>
</body>
</html>
